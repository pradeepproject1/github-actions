name: Deploy to Stage

on:
  push:
    branches:
      - stage

jobs:
  approval:
    name: Waiting for Approval
    runs-on: ubuntu-latest
    environment: stage        # stage environment has required reviewer set in GitHub Settings
    steps:
      - name: Approval granted
        run: echo "Deployment approved, proceeding to stage..."

  deploy:
    name: Deploy to Stage EC2
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.py,scripts/deploy.sh,scripts/healthcheck.sh,environments/stage.env"
          target: "/home/ec2-user/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            cp environments/stage.env .env
            chmod +x scripts/deploy.sh scripts/healthcheck.sh
            bash scripts/deploy.sh

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: bash /home/ec2-user/app/scripts/healthcheck.sh
